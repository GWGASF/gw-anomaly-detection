[tool.poetry]
name = "gw_anomaly_detection"
version = "0.1.0"
description = "Detecting anomaly signals in GW data."
authors = ["Chia-jui Chou <agoodmanjerry@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [  {include = "gw_anomaly_detection"},]

[tool.poetry.dependencies]
python = ">=3.10, <3.11"
gwpy = "^3.0.10"
bilby = "^2.3.0"
PyCBC = "^2.6.0"
boto3 = "^1.35.43"
toml = "^0.10.2"
lalsuite = "7.11" # Use 7.11 only on asz018.
numpy = "<2.0.0"
multiprocess = "*"
# torchmetrics = "^1"
# torchaudio = {version = "^2", source = "torch"}

matplotlib = ">=3.7.1"
h5py = ">=3.7.0"
torch = {version = "2.1.2", source = "torch"}
torchsummary = ">=1.5.1"
pyts = "=0.13.0"
tqdm = ">=4.65.0"
ipykernel = ">=6.19.2"
pyyaml = ">=6.0.2"
s3cmd = ">=2.2.0"
s3fs = ">=2024.12.0"
pynvml = ">=12.0.0"

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
