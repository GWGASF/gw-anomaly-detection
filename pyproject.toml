[tool.poetry]
name = "gw_anomaly_detection"
version = "0.1.0"
description = "Detecting anomaly signals in GW data."
authors = ["Chia-jui Chou <agoodmanjerry@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
  {include = "gw_anomaly_detection"},
]

[tool.poetry.dependencies]
python = ">=3.10, <3.11"
gwpy = "^3.0.10"
bilby = "^2.3.0"
PyCBC = "^2.6.0"
pyomicron= "2.0.6"
boto3 = "^1.35.43"
toml = "^0.10.2"
# lalsuite = "7.11" # Use 7.11 only on asz018.
numpy = "<2.0.0"
# torchmetrics = "^1"
# torchaudio = {version = "^2", source = "torch"}

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
