name: gwpipelinetest
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.1.2
  - scipy=1.10.1
  - torchvision
  - torchaudio
  - cudatoolkit=11.8  # CUDA-enabled PyTorch
  - gwpy=3.0.10
  - bilby=2.3.0
  - pycbc=2.6.0
  - boto3=1.35.43
  - toml=0.10.2
  - lalsuite=7.11 
  - numpy<2.0.0
  - multiprocess
  - matplotlib>=3.7.1
  - h5py>=3.7.0
  - pip
  - pip:
      - torchsummary>=1.5.1
      - pyts==0.13.0
      - tqdm>=4.65.0
      - ipykernel>=6.19.2
      - pyyaml>=6.0.2
      - s3cmd>=2.2.0
      - s3fs>=2024.12.0
      - pynvml>=12.0.0
      - setuptools<81

  # Development dependencies
  - jupyterlab
