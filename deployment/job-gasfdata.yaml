apiVersion: batch/v1
kind: Job
metadata:
  name: gwgasf-gasfdata
spec:
  template:
    spec:
      containers:
      - name: gwgasf-fullpipeline
        image: dfredin/gwgasf:gwpipelinetest
        command: ["/bin/sh", "-c"]
        args:
          - |
            poetry run python gw_anomaly_detection/gasf/src/main.py --newgasf --nbbh 500 --nbg 500 --nglitch 500
        resources:
          limits:
            memory: 32Gi
            cpu: "6000m"
          requests:
            memory: 16Gi
            cpu: "3000m"
      restartPolicy: Never
  backoffLimit: 5
