apiVersion: batch/v1
kind: Job
metadata:
  name: gwgasf-gasfdata
spec:
  template:
    spec:
      containers:
      - name: gwgasf-gasfdata
        image: dfredin/gwgasf:gwdatagasf
        env:
          - name: H1_TOTAL_START
            value: "1238166018"
          - name: H1_TOTAL_END
            value: "1253976375"
          - name: L1_TOTAL_START
            value: "1238166018"
          - name: L1_TOTAL_END
            value: "1253973796"
          - name: H1_KIND_START
            value: "1238166018"
          - name: H1_KIND_END
            value: "1238856487"
          - name: L1_KIND_START
            value: "1238166018"
          - name: L1_KIND_END
            value: "1238787928"
        command: ["conda", "run", "--no-capture-output", "-n", "gwpipelinetest", "bash", "-c"]
        args:
          - |
            python gw_anomaly_detection/gasf/src/main.py --newgasf --nbbh 500 --nbg 500 --nglitch 500
        resources:
          limits:
            memory: 256Gi
            cpu: "2000m"
            ephemeral-storage: 256Gi
          requests:
            memory: 32Gi
            cpu: "1000m"
            ephemeral-storage: 32Gi
      restartPolicy: Never
  backoffLimit: 5
