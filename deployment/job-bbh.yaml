apiVersion: batch/v1
kind: Job
metadata:
  name: gwgasf-bbhdata
spec:
  template:
    spec:
      containers:
      - name: gwgasf-bbhdata
        image: dfredin/gwgasf:gwpipelinetest
        env:
          - name: H1_TOTAL_START
            value: "1238166018"
          - name: H1_TOTAL_END
            value: "1238856499"
          - name: L1_TOTAL_START
            value: "1238166018"
          - name: L1_TOTAL_END
            value: "1238772909"
          - name: H1_KIND_START
            value: "1238172987"
          - name: H1_KIND_END
            value: "1238196793"
          - name: L1_KIND_START
            value: "1238205073"
          - name: L1_KIND_END
            value: "1238228885"
        command: ["conda", "run", "--no-capture-output", "-n", "gwpipelinetest", "bash", "-c"]
        args:
          - |
            mkdir -p test_data/bbh
            python get_asds.py &&
            python get_segments.py --samplenum 15000 &&
            python cli.py --sid 10000 --eid 15000 --ptype injection --itype bbh
        resources:
          limits:
            memory: 32Gi
            cpu: "6000m"
          requests:
            memory: 16Gi
            cpu: "3000m"
      restartPolicy: Never
  backoffLimit: 5
