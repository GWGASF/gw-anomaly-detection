apiVersion: batch/v1
kind: Job
metadata:
  name: gwgasf-bbhdata
spec:
  template:
    spec:
      containers:
      - name: gwgasf-bbhdata
        image: dfredin/gwgasf:gwpipelinetest
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p test_data/bbh && \
            poetry run python get_segments.py --samplenum 15000 && \
            poetry run python cli.py --sid 10000 --eid 15000 --ptype injection --itype bbh
        resources:
          limits:
            memory: 32Gi
            cpu: "6000m"
          requests:
            memory: 16Gi
            cpu: "3000m"
      restartPolicy: Never
  backoffLimit: 5
