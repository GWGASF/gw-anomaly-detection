apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-anomaly-detection
  labels:
    k8s-app: gw-anomaly-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: gw-anomaly-detection
  template:
    metadata:
      labels:
        k8s-app: gw-anomaly-detection
    spec:
      containers:
        - name: test
          image: gitlab-registry.nrp-nautilus.io/chiajuichou/gw-anomaly-detection:latest
          resources:
            limits:
              memory: 500Mi
              cpu: 500m
            requests:
              memory: 100Mi
              cpu: 50m
          command: ["sh", "-c", "sleep infinity"]
