apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-detection-data-bg
  labels:
    k8s-app: gw-detection-data-bg
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: gw-detection-data-bg
  template:
