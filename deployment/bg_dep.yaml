            - name: BG_L1_SEGMENT
              value: "1238205073-23812"
            - name: GLITCH_H1_SEGMENT
              value: "1238172987-23806"
            - name: GLITCH_L1_SEGMENT
              value: "1238205073-23812"
            - name: INJ_H1_SEGMENT
