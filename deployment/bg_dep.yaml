apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-anomaly-detection-data-bg
  labels:
    k8s-app: gw-anomaly-detection-data-bg
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: gw-anomaly-detection-data-bg
  template:
    metadata:
      labels:
        k8s-app: gw-anomaly-detection-data-bg
    spec:
      containers:
        - name: test-bg
          image: dfredin/gwgasf:testingdata
          resources:
            limits:
              memory: 20Gi
              cpu: 10000m
              ephemeral-storage: 20Gi
            requests:
              memory: 5Gi
              cpu: 2500m
              ephemeral-storage: 5Gi
          env:
            - name: KIND
              value: "background"
            - name: NUM_SAMPLES
              value: "100000"
            - name: START_ID
              value: "2000"
            - name: END_ID
              value: "3000"
            - name: INJ_WAVEFORM
              value: "bbh"
            - name: BUCKET
              value: "cchou"
            - name: UPLOAD_DIR
              value: "testing"
          command: ["sh", "-c", "/home/app/micromamba/env/bin/envsubst < /home/app/opt/data_config.yaml > /home/app/opt/data_config.yaml.tmp && mv /home/app/opt/data_config.yaml.tmp /home/app/opt/data_config.yaml && /home/app/micromamba/env/bin/python /home/app/opt/cli.py"]