apiVersion: batch/v1
kind: Job
metadata:
  name: gwgasf-training
spec:
  template:
    spec:
      containers:
      - name: gwgasf-training
        image: dfredin/gwgasf:gwdatagasf-cu121
        imagePullPolicy: Always
        env:
          - name: H1_TOTAL_START
            value: "1238166018"
          - name: H1_TOTAL_END
            value: "1253976375"
          - name: L1_TOTAL_START
            value: "1238166018"
          - name: L1_TOTAL_END
            value: "1253973796"
          - name: H1_KIND_START
            value: "1238166018"
          - name: H1_KIND_END
            value: "1238856487"
          - name: L1_KIND_START
            value: "1238166018"
          - name: L1_KIND_END
            value: "1238787928"
        command: ["conda", "run", "--no-capture-output", "-n", "gwpipelinetest", "bash", "-c"]
        args:
          - |
            python gw_anomaly_detection/gasf/src/main.py --train --nbbh 50000 --nbg 50000 --nglitch 50000 --epoch 35 --batch 32
        resources:
          limits:
            memory: 256Gi
            cpu: "7000m"
            nvidia.com/gpu: 1
            ephemeral-storage: 128Gi  
          requests:
            memory: 32Gi
            cpu: "2000m"
            nvidia.com/gpu: 1
            ephemeral-storage: 16Gi  
      restartPolicy: Never
  backoffLimit: 5
